<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Camera Demo</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; }
        video { width: 90%; max-width: 480px; margin-top: 20px; border-radius: 12px; background: #000; }
        button { margin: 10px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>相機預覽</h2>
    <button onclick="startCamera('user')">前鏡頭</button>
    <button onclick="startCamera('environment')">後鏡頭</button>
    <br>
    <!-- 新增 muted 屬性以確保在各瀏覽器皆能順利自動播放 -->
    <video id="video" autoplay playsinline muted></video>

    <script>
    let currentStream = null;

    async function startCamera(facingMode) {
        const videoElement = document.getElementById("video");

        // 1. 徹底清理舊的串流與視訊源
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        videoElement.srcObject = null; 

        // 2. 嘗試使用 exact 嚴格模式請求鏡頭
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: facingMode } }, 
                audio: false 
            });
            handleSuccess(stream, videoElement);
        } catch (err) {
            console.warn("嚴格模式失敗，嘗試相容模式...", err);
            
            // 3. 降級方案（相容桌機或不支援 exact 的行動瀏覽器）
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode }, 
                    audio: false 
                });
                handleSuccess(stream, videoElement);
            } catch (e) {
                console.error("相機完全無法存取：", e);
                alert("無法存取相機，請檢查權限或是否被其他應用程式佔用。");
            }
        }
    }

    // 成功取得串流後的處理函式
    function handleSuccess(stream, videoElement) {
        currentStream = stream;
        videoElement.srcObject = stream;
    }
    </script>
</body>
</html>
