<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給廖唯希的驚喜</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #ffb6d9, #ff82b5);
    color: white;
}

.page {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.title {
    font-size: 45px;
    font-weight: bold;
    margin-bottom: 15px;
}

.text {
    font-size: 20px;
    margin-bottom: 40px;
}

button {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid white;
    background: linear-gradient(145deg, #ffb8d5, #ff5f9d);
    color: white;
    font-size: 35px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(255,255,255,.5);
}

button:active {
    transform: scale(.9);
}

.heart {
    position: absolute;
    font-size: 30px;
    animation: float 5s infinite ease-in-out;
    opacity: .7;
}

.final {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.big-heart {
    font-size: 220px;
    color: #ff4f91;
    text-shadow: 0 0 40px white;
    animation: heart 1s infinite;
}

.message {
    position: absolute;
    font-size: 38px;
    font-weight: bold;
    text-shadow: 0 3px 15px rgba(0,0,0,.2);
}

.particle {
    position: absolute;
    font-size: 25px;
    pointer-events: none;
    animation: explode 1.5s forwards;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-30px);
    }
}

@keyframes heart {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

@keyframes explode {
    from {
        transform: translate(0,0) scale(1);
        opacity: 1;
    }

    to {
        transform: translate(var(--x),var(--y)) scale(1.5);
        opacity: 0;
    }
}

@media (max-width: 600px) {
    .title {
        font-size: 32px;
    }

    .text {
        font-size: 17px;
    }

    button {
        width: 150px;
        height: 150px;
        font-size: 30px;
    }

    .big-heart {
        font-size: 170px;
    }

    .message {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div id="start">
        <div class="title">給最愛的唯希 ♥</div>
        <div class="text">點擊開始，收下我的驚喜</div>
        <button onclick="start()">開始</button>
    </div>

    <div class="heart" style="top:10%;left:10%;">♥</div>
    <div class="heart" style="top:20%;right:15%;">♡</div>
    <div class="heart" style="bottom:15%;left:20%;">♥</div>
    <div class="heart" style="bottom:20%;right:10%;">♡</div>

    <div class="final" id="final">
        <div class="big-heart">♥</div>
        <div class="message">
            廖唯希<br>
            我愛你～
        </div>
    </div>

</div>

<script>
function start() {
    document.getElementById("start").style.display = "none";

    for (let i = 0; i < 40; i++) {
        let p = document.createElement("div");

        p.className = "particle";
        p.innerHTML = Math.random() > 0.5 ? "♥" : "♡";

        p.style.left = "50%";
        p.style.top = "50%";

        let x = (Math.random() - 0.5) * 600;
        let y = (Math.random() - 0.5) * 600;

        p.style.setProperty("--x", x + "px");
        p.style.setProperty("--y", y + "px");

        document.body.appendChild(p);

        setTimeout(() => {
            p.remove();
        }, 1500);
    }

    setTimeout(() => {
        document.getElementById("final").style.display = "flex";
    }, 800);
}
</script>

</body>
</html>
