<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Camera Demo</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }
    video {
      width: 90%;
      max-width: 480px;
      margin-top: 20px;
      border-radius: 12px;
      background: #000;
    }
    button {
      margin: 10px;
      padding: 10px 16px;
    }
  </style>
</head>

<body>
  <h2>相機預覽</h2>

  <button onclick="startCamera('user')">前鏡頭</button>
  <button onclick="startCamera('environment')">後鏡頭</button>

  <video id="video" autoplay playsinline></video>

  <script>
    let currentStream = null;

    async function startCamera(facingMode) {
      try {
        // 停掉舊串流
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        // 請求相機權限 + 指定鏡頭
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: facingMode } },
          audio: false
        });

        currentStream = stream;
        document.getElementById("video").srcObject = stream;

      } catch (err) {
        console.error("相機啟動失敗：", err);

        // fallback（某些手機不支援 exact）
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode },
            audio: false
          });

          currentStream = stream;
          document.getElementById("video").srcObject = stream;

        } catch (e) {
          alert("無法存取相機");
        }
      }
    }
  </script>
</body>
</html>
