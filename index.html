<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>工作站 - 影像傳輸端</title>
    <!-- 引入 PeerJS 核心函式庫 -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #preview { width: 100%; max-width: 400px; border: 2px solid #ccc; border-radius: 8px; }
        .status { color: #666; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>影像傳輸工作站</h2>
    <video id="preview" autoplay playsinline muted></video>
    <p id="status" class="status">正在初始化相機...</p>

    <script>
    // 固定的連線頻道 ID，後台端將透過這個 ID 連進來
    const ROOM_ID = "live-monitor-channel-12345"; 
    
    // 初始化 PeerJS 物件，使用官方免費的雲端伺服器
    const peer = new Peer(ROOM_ID);
    let localStream = null;

    // 1. 請求相機權限並取得畫面串流
    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user" }, // 使用前置鏡頭
        audio: false                    // 關閉聲音以防回音
    })
    .then(function(stream) {
        localStream = stream;
        // 將自己的畫面顯示在預覽視窗
        const videoElement = document.getElementById("preview");
        videoElement.srcObject = stream;
        document.getElementById("status").innerText = "相機已就緒，等待後台連線...";

        // 2. 監聽是否有後台端連入
        peer.on('call', function(call) {
            document.getElementById("status").innerText = "後台已連線，正在實時傳輸影像...";
            
            // 應答連線，並將平板的視訊串流傳送過去
            call.answer(localStream);
            
            // 監聽連線中斷
            call.on('close', () => {
                document.getElementById("status").innerText = "後台已中斷連線，等待重新連線...";
            });
        });
    })
    .catch(function(err) {
        console.error("無法取得相機權限:", err);
        document.getElementById("status").innerText = "錯誤：請允許相機權限以進行傳輸。";
    });

    peer.on('error', function(err) {
        console.error("PeerJS 錯誤:", err);
        if (err.type === 'unavailable-id') {
            document.getElementById("status").innerText = "錯誤：此頻道已被佔用，請重新整理網頁。";
        }
    });
    </script>

</body>
</html>
